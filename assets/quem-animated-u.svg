<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100%" height="100%">
  <style>
    @keyframes blink {
      0%, 40%, 48%, 56%, 100% {
        transform: scaleY(1);
      }
      44%, 52% {
        transform: scaleY(0.08);
      }
    }
    .eye-l {
      transform-origin: 30px 22px;
      animation: blink 3.8s ease-in-out infinite;
    }
    .eye-r {
      transform-origin: 70px 22px;
      animation: blink 3.8s ease-in-out infinite;
    }
  </style>
  <!-- Ojo Izquierdo en RGB(0, 249, 255) / #00F9FF -->
  <circle cx="30" cy="22" r="11" fill="rgb(0, 249, 255)" class="eye-l" />
  <!-- Ojo Derecho en RGB(0, 249, 255) / #00F9FF -->
  <circle cx="70" cy="22" r="11" fill="rgb(0, 249, 255)" class="eye-r" />
  <!-- Cuerpo U en RGB(0, 249, 255) / #00F9FF -->
  <path d="M 20 44 L 20 105 C 20 135, 80 135, 80 105 L 80 44 L 100 44 L 100 105 C 100 155, 0 155, 0 105 L 0 44 Z" fill="rgb(0, 249, 255)" />
</svg>
